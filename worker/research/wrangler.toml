name = "market-brief-research"
main = "research-worker.js"
compatibility_date = "2026-09-23"

# Cache + rate-limit storage. Create it once with
#   wrangler kv namespace create RESEARCH
# and paste the id it prints below.
[[kv_namespaces]]
binding = "RESEARCH"
id = "0545a6fbadb7422ead4c41ee52a7c495"

# Secrets are set with `wrangler secret put NAME`, never written in this file:
#   ANTHROPIC_API_KEY, ALPACA_KEY_ID, ALPACA_SECRET_KEY, FINNHUB_KEY
