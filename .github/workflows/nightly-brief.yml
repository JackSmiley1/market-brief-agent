name: Nightly Market Brief
on:
  schedule:
    - cron: '30 20 * * 1-5'   # 4:30pm ET weekdays during EDT (UTC-4). When DST ends (~early Nov), change back to '30 21' for EST (UTC-5).
  workflow_dispatch: {}
permissions:
  contents: write   # GITHUB_TOKEN defaults to read-only; the commit-back step needs write access
# Shared with on-demand-trade.yml: both workflows write to the same
# logs/brief-data.db and commit+push. Without this, an on-demand trade
# triggered at the same moment as the nightly run could race it — two
# runners editing their own checked-out copy of the same sqlite file, one
# push succeeding and the other failing non-fast-forward. Same group name
# in both files makes GitHub queue them instead of running concurrently.
concurrency:
  group: market-brief-pipeline
  cancel-in-progress: false
jobs:
  run-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22' }   # node:sqlite (used by src/db.js) needs Node 22.5+
      - run: npm install
      - name: Run tests (sizing logic must be correct before it touches real orders)
        run: npm test
      - run: npm run brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      - name: Run nightly crypto watchlist (separate source tag, long-only, flat sizing)
        # Same job/commit as the stock brief above, not a separate cron —
        # avoids any risk of the two racing on the same committed db file.
        # Failure here is non-fatal to the rest of the workflow (own
        # try/catch inside cryptoNightly.js isn't needed at this level since
        # this step runs independently of reflect/export-site below it).
        run: npm run crypto-brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        continue-on-error: true
      - name: Reflect on recent losing trades (Reflexion-style lesson synthesis)
        # Runs AFTER the brief, not before: it needs tonight's paper-trading
        # cycle (just reconciled above) to see the fullest, freshest set of
        # closed losses. Its own gate (MIN_NEW_LOSSES in reflect.js) means
        # this is a no-op most nights — it only calls the API and writes a
        # row when there's actually a big enough new batch to reflect on.
        # Whatever it writes here feeds into the NEXT night's brief, not
        # tonight's (already generated above).
        run: npm run reflect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Export public dashboard data
        run: npm run export-site
      - name: Commit brief + dashboard data back to repo
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@github.com"
          git add logs/ docs/data.json
          git commit -m "Nightly brief: $(date +'%Y-%m-%d')" || echo "No changes"
          git pull --rebase || true
          git push
